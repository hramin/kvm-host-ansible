---
# Takes a fresh Debian 12/13 server to a ready KVM/libvirt virtualization host.
#
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook site.yml                     # normal run (no package upgrade)
#   ansible-playbook site.yml --tags upgrade      # opt-in full package upgrade only
- name: Prepare Debian KVM/libvirt virtualization hosts
  hosts: kvm_hosts
  become: true
  gather_facts: true
  roles:
    - role: base_hardening
      tags: [base_hardening]
    - role: kvm_host
      tags: [kvm_host]
