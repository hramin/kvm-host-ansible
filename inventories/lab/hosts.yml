---
# Lab inventory: one clean Debian VM.
# Every CHANGEME value must be replaced before the first run; the
# base_hardening preflight refuses to run while any placeholder is left
# (README "Placeholders to fill in").
all:
  children:
    kvm_hosts:
      hosts:
        lab-kvm01:
          ansible_host: CHANGEME_LAB_VM_IP   # address of the clean Debian VM
