---
# Internal values (not meant to be overridden).

# Modules to load: the configured list plus the detected vendor module
# (kvm_host_vendor_module is set in tasks/preflight.yml).
kvm_host_modules: "{{ kvm_host_kernel_modules + ([kvm_host_vendor_module] if kvm_host_vendor_module != 'none' else []) }}"

# sysctl keys that are per network namespace (set live in container test mode).
kvm_host_netns_sysctl_regex: '^net\.(ipv4|ipv6|bridge)\.'
