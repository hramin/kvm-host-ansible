---
- name: Assert the test mode value is known
  ansible.builtin.assert:
    that:
      - kvm_host_test_mode in ['off', 'container']
    fail_msg: "kvm_host_test_mode must be 'off' or 'container', got '{{ kvm_host_test_mode }}'."
    quiet: true

- name: Assert a supported Debian release
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Debian'
      - ansible_facts['distribution_major_version'] in kvm_host_supported_debian_versions
    fail_msg: >-
      kvm_host supports Debian {{ kvm_host_supported_debian_versions | join(' and ') }};
      the target reports {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}.
    quiet: true

- name: Assert valid option values
  ansible.builtin.assert:
    that:
      - kvm_host_kvm_vendor_module in ['auto', 'kvm_intel', 'kvm_amd', 'none']
      - kvm_host_bridge_ip_mode in ['none', 'dhcp', 'static']
      - kvm_host_guests_on_boot in ['start', 'ignore']
      - kvm_host_guests_on_shutdown in ['shutdown', 'suspend']
      - kvm_host_bridge_ip_mode != 'static' or kvm_host_bridge_address | length > 0
    fail_msg: "Check kvm_host_kvm_vendor_module, kvm_host_bridge_ip_mode/_address and kvm_host_guests_* values."
    quiet: true

# rc 1 = no match (no hardware virtualization), anything else is an error.
- name: Detect hardware virtualization (vmx/svm CPU flag)
  ansible.builtin.command: grep -m1 -owE 'vmx|svm' /proc/cpuinfo
  register: kvm_host_cpu_virt_flag
  changed_when: false
  failed_when: kvm_host_cpu_virt_flag.rc > 1

- name: Choose the KVM vendor module
  ansible.builtin.set_fact:
    kvm_host_vendor_module: >-
      {{ kvm_host_kvm_vendor_module if kvm_host_kvm_vendor_module != 'auto'
         else {'vmx': 'kvm_intel', 'svm': 'kvm_amd'}.get(kvm_host_cpu_virt_flag.stdout | trim, 'none') }}

- name: Assert hardware virtualization unless software emulation is allowed
  ansible.builtin.assert:
    that:
      - kvm_host_cpu_virt_flag.rc == 0 or kvm_host_allow_software_emulation | bool
    fail_msg: >-
      The CPU exposes neither vmx (Intel VT-x) nor svm (AMD-V). Enable virtualization in
      the BIOS, or nested virtualization for a VM. For a lab without it, set
      kvm_host_allow_software_emulation: true (guests run under slow TCG emulation).
    quiet: true

- name: Warn that guests will run without KVM acceleration
  ansible.builtin.debug:
    msg: >-
      WARNING: no vmx/svm CPU flag on {{ inventory_hostname }}. kvm_host_allow_software_emulation
      is true, so the play continues, but guests will run under QEMU TCG software emulation
      (10-50x slower). Lab use only - enable nested virtualization for a real test.
  when: kvm_host_cpu_virt_flag.rc != 0
