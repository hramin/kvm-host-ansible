---
- name: List libvirt networks
  community.libvirt.virt_net:
    command: list_nets
  register: kvm_host_libvirt_networks
  changed_when: false

# ── libvirt "default" NAT network ────────────────────────────────────────────
# Disabled by default: production guests use the bridge, and the NAT network
# would add a 192.168.122.0/24 router, dnsmasq and libvirt firewall rules on
# every host. It stays defined, so it can be started by hand at any time.
- name: Stop the default NAT network
  community.libvirt.virt_net:
    name: default
    state: inactive
  when:
    - not kvm_host_libvirt_default_network_enabled | bool
    - "'default' in kvm_host_libvirt_networks.list_nets"

- name: Do not autostart the default NAT network
  community.libvirt.virt_net:
    name: default
    autostart: false
  when:
    - not kvm_host_libvirt_default_network_enabled | bool
    - "'default' in kvm_host_libvirt_networks.list_nets"

- name: Read libvirt's default network definition
  ansible.builtin.slurp:
    src: /usr/share/libvirt/networks/default.xml
  register: kvm_host_default_net_xml
  when:
    - kvm_host_libvirt_default_network_enabled | bool
    - "'default' not in kvm_host_libvirt_networks.list_nets"

- name: Define the default NAT network
  community.libvirt.virt_net:
    command: define
    name: default
    xml: "{{ kvm_host_default_net_xml.content | b64decode }}"
  when:
    - kvm_host_libvirt_default_network_enabled | bool
    - "'default' not in kvm_host_libvirt_networks.list_nets"

- name: Start the default NAT network
  community.libvirt.virt_net:
    name: default
    state: active
  when: kvm_host_libvirt_default_network_enabled | bool

- name: Autostart the default NAT network
  community.libvirt.virt_net:
    name: default
    autostart: true
  when: kvm_host_libvirt_default_network_enabled | bool

# ── Bridge for bridged guests (off by default) ───────────────────────────────
- name: Bridged networking
  when: kvm_host_bridge_enabled | bool
  block:
    # Enslaving the NIC that carries the default route moves the host's address
    # to the bridge; done remotely that usually ends the SSH session.
    - name: Assert the management interface is not enslaved by accident
      ansible.builtin.assert:
        that:
          - kvm_host_bridge_allow_default_route_interface | bool or
            kvm_host_default_route_interface not in kvm_host_bridge_interfaces
        fail_msg: >-
          {{ kvm_host_default_route_interface }} carries the default route and is listed in
          kvm_host_bridge_interfaces. Use a dedicated NIC for the VM bridge, or set
          kvm_host_bridge_allow_default_route_interface: true with console access at hand.
        quiet: true
      vars:
        kvm_host_default_route_interface: "{{ (ansible_facts['default_ipv4'] | default({})).interface | default('') }}"

    # systemd-networkd only manages the interfaces matched below, so it
    # coexists with ifupdown/netplan managing the management NIC.
    - name: Define the bridge device
      ansible.builtin.template:
        src: bridge.netdev.j2
        dest: "/etc/systemd/network/50-kvm-host-{{ kvm_host_bridge_name }}.netdev"
        owner: root
        group: systemd-network
        mode: "0640"
      notify: Reload systemd-networkd

    - name: Configure the bridge
      ansible.builtin.template:
        src: bridge.network.j2
        dest: "/etc/systemd/network/50-kvm-host-{{ kvm_host_bridge_name }}.network"
        owner: root
        group: systemd-network
        mode: "0640"
      notify: Reload systemd-networkd

    - name: Attach uplinks to the bridge
      ansible.builtin.template:
        src: bridge-port.network.j2
        dest: "/etc/systemd/network/50-kvm-host-{{ kvm_host_bridge_name }}-{{ item }}.network"
        owner: root
        group: systemd-network
        mode: "0640"
      loop: "{{ kvm_host_bridge_interfaces }}"
      notify: Reload systemd-networkd

    - name: Enable and start systemd-networkd
      ansible.builtin.systemd_service:
        name: systemd-networkd
        enabled: true
        state: started

# The bridge must exist before libvirt starts a network on top of it.
# (Outside the block: flush_handlers does not take a "when".)
- name: Apply pending network changes
  ansible.builtin.meta: flush_handlers

- name: Libvirt network on the bridge
  when: kvm_host_bridge_enabled | bool
  block:
    - name: Define the libvirt bridge network
      community.libvirt.virt_net:
        command: define
        name: "{{ kvm_host_bridge_libvirt_network }}"
        xml: "{{ lookup('ansible.builtin.template', 'libvirt-bridge-network.xml.j2') }}"

    - name: Start the libvirt bridge network
      community.libvirt.virt_net:
        name: "{{ kvm_host_bridge_libvirt_network }}"
        state: active

    - name: Autostart the libvirt bridge network
      community.libvirt.virt_net:
        name: "{{ kvm_host_bridge_libvirt_network }}"
        autostart: true
