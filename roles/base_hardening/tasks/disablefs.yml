---
- name: Efi fact
  ansible.builtin.set_fact:
    base_hardening_booted_with_efi: "{{ ansible_facts['mounts'] | selectattr('mount', 'equalto', '/boot/efi') | list | length > 0 }}"

- name: Disable file system kernel modules
  ansible.builtin.lineinfile:
    dest: /etc/modprobe.d/disablefs.conf
    line: "install {{ item }} /bin/true"
    mode: "0644"
    owner: root
    group: root
    state: present
    create: true
  loop: "{{ base_hardening_fs_modules_blocklist }}"
  when: not base_hardening_booted_with_efi

- name: Dont disable vfat file system kernel modules if efi
  ansible.builtin.lineinfile:
    dest: /etc/modprobe.d/disablefs.conf
    line: "install {{ item }} /bin/true"
    mode: "0644"
    owner: root
    group: root
    state: present
    create: true
  loop: "{{ base_hardening_fs_modules_blocklist | reject('search', 'vfat') | list }}"
  when: base_hardening_booted_with_efi | bool
...
