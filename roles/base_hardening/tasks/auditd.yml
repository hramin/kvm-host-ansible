---
# GRUB is skipped in container test mode (no bootloader) and on hosts that do
# not boot through GRUB (no update-grub, e.g. systemd-boot).
- name: Check for update-grub
  ansible.builtin.stat:
    path: /usr/sbin/update-grub
  register: base_hardening_update_grub
  when:
    - base_hardening_auditd_grub_cmdline_enabled | bool
    - base_hardening_test_mode != 'container'

- name: Set Debian audit grub cmdline
  ansible.builtin.lineinfile:
    regexp: '^GRUB_CMDLINE_LINUX='
    line: 'GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX {{ base_hardening_grub_audit_cmdline }} {{ base_hardening_grub_audit_backlog_cmdline }}"'
    dest: /etc/default/grub.d/99-hardening-audit.cfg
    state: present
    create: true
    mode: "0644"
    owner: root
    group: root
  notify: Update grub
  when:
    - base_hardening_auditd_grub_cmdline_enabled | bool
    - base_hardening_test_mode != 'container'
    - base_hardening_update_grub.stat.exists

- name: Warn that the audit kernel arguments were not applied
  ansible.builtin.debug:
    msg: >-
      update-grub not found: audit=1 / audit_backlog_limit were NOT added to the kernel
      command line. Add them to your bootloader configuration manually.
  when:
    - base_hardening_auditd_grub_cmdline_enabled | bool
    - base_hardening_test_mode != 'container'
    - not base_hardening_update_grub.stat.exists

- name: Set audit action_mail_acct
  ansible.builtin.lineinfile:
    regexp: "^action_mail_acct ="
    line: "action_mail_acct = {{ base_hardening_auditd_action_mail_acct }}"
    dest: /etc/audit/auditd.conf
    mode: "0640"
    state: present
    create: false
  notify: Reload auditd

- name: Set audit admin_space_left_action
  ansible.builtin.lineinfile:
    regexp: "^admin_space_left_action = "
    line: "admin_space_left_action = {{ base_hardening_auditd_admin_space_left_action }}"
    dest: /etc/audit/auditd.conf
    mode: "0640"
    state: present
    create: false
  notify: Reload auditd

- name: Set audit disk_error_action
  ansible.builtin.lineinfile:
    regexp: "^disk_error_action ="
    line: "disk_error_action = {{ base_hardening_auditd_disk_error_action }}"
    dest: /etc/audit/auditd.conf
    mode: "0640"
    state: present
    create: false
  notify: Reload auditd

- name: Set audit disk_full_action
  ansible.builtin.lineinfile:
    regexp: "^disk_full_action ="
    line: "disk_full_action = {{ base_hardening_auditd_disk_full_action }}"
    dest: /etc/audit/auditd.conf
    mode: "0640"
    state: present
    create: false
  notify: Reload auditd

- name: Set audit max_log_file
  ansible.builtin.lineinfile:
    regexp: "^max_log_file ="
    line: "max_log_file = {{ base_hardening_auditd_max_log_file }}"
    dest: /etc/audit/auditd.conf
    mode: "0640"
    state: present
    create: false
  notify: Reload auditd

- name: Set audit max_log_file_action
  ansible.builtin.lineinfile:
    regexp: "^max_log_file_action ="
    line: "max_log_file_action = {{ base_hardening_auditd_max_log_file_action }}"
    dest: /etc/audit/auditd.conf
    mode: "0640"
    state: present
    create: false
  notify: Reload auditd

- name: Set audit num_logs
  ansible.builtin.lineinfile:
    regexp: "^num_logs ="
    line: "num_logs = {{ base_hardening_auditd_num_logs }}"
    dest: /etc/audit/auditd.conf
    mode: "0640"
    state: present
    create: false
  notify: Reload auditd

- name: Set audit space_left
  ansible.builtin.lineinfile:
    regexp: "^space_left ="
    line: "space_left = {{ base_hardening_auditd_space_left }}"
    dest: /etc/audit/auditd.conf
    mode: "0640"
    state: present
    create: false
  notify: Reload auditd

- name: Set audit space_left_action
  ansible.builtin.lineinfile:
    regexp: "^space_left_action ="
    line: "space_left_action = {{ base_hardening_auditd_space_left_action }}"
    dest: /etc/audit/auditd.conf
    mode: "0640"
    state: present
    create: false
  notify: Reload auditd

- name: Audit.rules
  ansible.builtin.template:
    src: hardening.rules.j2
    dest: /etc/audit/rules.d/hardening.rules
    backup: true
    mode: "0600"
    owner: root
    group: root
  when: base_hardening_auditd_apply_rules | bool
  notify:
    - Load audit rules

# auditd needs the host's audit subsystem; a container cannot run it.
- name: Enable and start auditd
  ansible.builtin.systemd_service:
    name: auditd
    enabled: true
    state: started
  when: base_hardening_test_mode != 'container'
...
