---
# Debian's auditd.conf already rotates its logs (5 x 8 MB) and only logs a
# warning when space runs low, so it is left as shipped. The role adds a
# short, hypervisor-focused rule set; augenrules merges it with Debian's
# rules.d/audit.rules (-D, -b 8192, -f 1).
- name: Install the audit rules
  ansible.builtin.template:
    src: hardening.rules.j2
    dest: /etc/audit/rules.d/hardening.rules
    owner: root
    group: root
    mode: "0600"
  notify: Load audit rules

- name: Enable and start auditd
  ansible.builtin.systemd_service:
    name: auditd
    enabled: true
    state: started
