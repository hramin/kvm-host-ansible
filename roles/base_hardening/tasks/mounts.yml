---
- name: Install the /tmp tmpfs mount unit
  ansible.builtin.template:
    src: tmp.mount.j2
    dest: /etc/systemd/system/tmp.mount
    owner: root
    group: root
    mode: "0644"
    backup: true
  register: base_hardening_tmp_unit
  notify: Remount tmp
  when: base_hardening_tmp_mount_enabled | bool

# daemon-reload (only when the unit changed) so systemd knows the new unit
# before enabling/starting it; the "Remount tmp" handler then applies new
# options to an already mounted /tmp (Debian 13 mounts /tmp as tmpfs already).
# TMPDIR: Ansible unpacks the running module under $TMPDIR; on a host where
# /tmp is not a tmpfs yet (Debian 12) the new mount would hide those files
# from the module that creates it.
- name: Mount /tmp as tmpfs
  ansible.builtin.systemd_service:
    name: tmp.mount
    enabled: true
    state: started
    daemon_reload: "{{ base_hardening_tmp_unit is changed }}"
  environment:
    TMPDIR: /var/tmp
  when: base_hardening_tmp_mount_enabled | bool

# fstab entry + remount; systemd-remount-fs re-applies it at boot.
- name: Mount /proc with hidepid
  ansible.posix.mount:
    path: /proc
    src: proc
    fstype: proc
    opts: >-
      defaults,hidepid={{ base_hardening_proc_hidepid }}{{
      (',gid=' ~ base_hardening_proc_hidepid_group) if base_hardening_proc_hidepid_group | length > 0 else '' }}
    state: mounted
