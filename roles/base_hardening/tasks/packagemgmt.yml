---
- name: Configure apt
  ansible.builtin.lineinfile:
    dest: /etc/apt/apt.conf.d/98-hardening
    mode: "0644"
    state: present
    create: true
    line: "{{ item }}"
  loop:
    - 'Acquire::AllowDowngradeToInsecureRepositories "false";'
    - 'Acquire::AllowInsecureRepositories "false";'
    - 'Acquire::http::AllowRedirect "false";'
    - 'APT::Get::AllowUnauthenticated "false";'
    - 'APT::Get::AutomaticRemove "true";'
    - 'APT::Install-Recommends "false";'
    - 'APT::Install-Suggests "false";'
    - 'APT::Periodic::AutocleanInterval "7";'
    - 'APT::Sandbox::Seccomp "1";'
    - 'Unattended-Upgrade::Remove-Unused-Dependencies "true";'

# update_cache alone never reports "changed", so the old apt-get
# clean/autoremove handlers notified from here could not fire; dropped.
- name: Apt update
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 1800

# The full package upgrade moved to tasks/upgrade.yml and runs only on request
# (--tags upgrade), so a normal run never upgrades the system.
...
