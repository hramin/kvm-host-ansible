---
# yamllint disable rule:commas
# (Intentional: the sysctl list below keeps the seed's column-aligned table.)
# Apply kernel hardening parameters (CIS / STIG aligned, Debian 12/13)
# Removed: br_netfilter module load (Kubernetes-specific)
# Removed: ip_forward=1, reserved_ports, ip_nonlocal_bind, nf_conntrack_*, somaxconn,
#          rmem/wmem tuning, tcp_tw_reuse, bridge-nf-call-* (all K8s / performance-only)
# Removed: net.ipv4.ip_forward is not managed at all: libvirt switches it on when it
#          starts a NAT network, and pinning it here would undo that on every run.
# Moved:   vm.swappiness and bridge-nf-call-* = 0 live in kvm_host (hypervisor tuning).
#
# Every key is written to /etc/sysctl.d/99-hardening.conf (applied at boot) and set
# live one by one (sysctl_set) instead of re-reading the whole file with "sysctl -p".
# In container test mode only network-namespaced keys are set live; the others
# would change the container host's kernel, so for them only the file is written.
# A kernel booted with ipv6.disable=1 has no net.ipv6.* keys at all; those are
# then only written to the file (IPv6 is already off).
- name: Check whether the kernel has IPv6
  ansible.builtin.stat:
    path: /proc/sys/net/ipv6
  register: base_hardening_ipv6_proc

- name: Apply kernel hardening sysctl settings
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-hardening.conf
    sysctl_set: >-
      {{ (base_hardening_test_mode != 'container' or item.key is match(base_hardening_netns_sysctl_regex))
         and (base_hardening_ipv6_proc.stat.exists or not item.key.startswith('net.ipv6.')) }}
    reload: false
  loop:
    # ── IPv6 disable (base_hardening_disable_ipv6, default off on a hypervisor) ─
    - { key: "net.ipv6.conf.all.disable_ipv6",             value: "{{ base_hardening_disable_ipv6 | bool | ternary('1', '0') }}" }
    - { key: "net.ipv6.conf.default.disable_ipv6",         value: "{{ base_hardening_disable_ipv6 | bool | ternary('1', '0') }}" }
    - { key: "net.ipv6.conf.lo.disable_ipv6",              value: "{{ base_hardening_disable_ipv6 | bool | ternary('1', '0') }}" }

    # ── ICMP redirect protection ──────────────────────────────────────────────
    - { key: "net.ipv4.conf.all.accept_redirects",         value: "0" }
    - { key: "net.ipv4.conf.default.accept_redirects",     value: "0" }
    - { key: "net.ipv4.conf.all.send_redirects",           value: "0" }
    - { key: "net.ipv4.conf.default.send_redirects",       value: "0" }
    - { key: "net.ipv6.conf.all.accept_redirects",         value: "0" }
    - { key: "net.ipv6.conf.default.accept_redirects",     value: "0" }

    # ── Source routing ────────────────────────────────────────────────────────
    - { key: "net.ipv4.conf.all.accept_source_route",      value: "0" }
    - { key: "net.ipv4.conf.default.accept_source_route",  value: "0" }

    # ── Reverse-path filtering (anti-spoofing) ────────────────────────────────
    - { key: "net.ipv4.conf.all.rp_filter",                value: "1" }
    - { key: "net.ipv4.conf.default.rp_filter",            value: "1" }

    # ── Martian packet logging ────────────────────────────────────────────────
    - { key: "net.ipv4.conf.all.log_martians",             value: "1" }
    - { key: "net.ipv4.conf.default.log_martians",         value: "1" }

    # ── ICMP broadcast / bogus error suppression ──────────────────────────────
    - { key: "net.ipv4.icmp_echo_ignore_broadcasts",       value: "1" }
    - { key: "net.ipv4.icmp_ignore_bogus_error_responses", value: "1" }

    # ── TCP security ──────────────────────────────────────────────────────────
    - { key: "net.ipv4.tcp_syncookies",                    value: "1" }
    - { key: "net.ipv4.tcp_rfc1337",                       value: "1" }
    - { key: "net.ipv4.tcp_synack_retries",                value: "2" }
    - { key: "net.ipv4.tcp_fin_timeout",                   value: "15" }
    - { key: "net.ipv4.tcp_keepalive_time",                value: "300" }
    - { key: "net.ipv4.tcp_keepalive_probes",              value: "5" }
    - { key: "net.ipv4.tcp_keepalive_intvl",               value: "15" }

    # ── Kernel information leakage ────────────────────────────────────────────
    - { key: "kernel.dmesg_restrict",                      value: "1" }
    - { key: "kernel.kptr_restrict",                       value: "2" }
    - { key: "kernel.printk",                              value: "3 4 1 7" }

    # ── Core dump / SUID hardening ────────────────────────────────────────────
    - { key: "fs.suid_dumpable",                           value: "0" }
    - { key: "kernel.core_uses_pid",                       value: "1" }

    # ── SysRq (base_hardening_sysctl_kernel_sysrq, default 176) ───────────────
    - { key: "kernel.sysrq",                               value: "{{ base_hardening_sysctl_kernel_sysrq }}" }

    # ── ptrace scope (Yama LSM) ───────────────────────────────────────────────
    - { key: "kernel.yama.ptrace_scope",                   value: "1" }

    # ── ASLR ──────────────────────────────────────────────────────────────────
    - { key: "kernel.randomize_va_space",                  value: "2" }

    # ── BPF hardening ─────────────────────────────────────────────────────────
    - { key: "kernel.unprivileged_bpf_disabled",           value: "1" }
    - { key: "net.core.bpf_jit_harden",                    value: "2" }

    # ── TTY / FIFO / link protections ─────────────────────────────────────────
    - { key: "dev.tty.ldisc_autoload",                     value: "0" }
    - { key: "fs.protected_fifos",                         value: "2" }
    - { key: "fs.protected_hardlinks",                     value: "1" }
    - { key: "fs.protected_symlinks",                      value: "1" }
  loop_control:
    label: "{{ item.key }} = {{ item.value }}"
