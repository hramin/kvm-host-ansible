---
- name: Disable misc kernel modules
  ansible.builtin.lineinfile:
    dest: /etc/modprobe.d/disablemod.conf
    line: "install {{ item }} /bin/true"
    mode: "0644"
    owner: root
    group: root
    state: present
    create: true
  loop: "{{ base_hardening_misc_modules_blocklist }}"

- name: Index blacklisted kernel modules
  environment:
    PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  ansible.builtin.shell: |
    set -o pipefail
    modprobe -c | grep -o '^blacklist .*' | awk '{print $2}'
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: base_hardening_modprobe_blacklist.rc != 0
  register: base_hardening_modprobe_blacklist
  when: base_hardening_block_blacklisted | bool

- name: Block blacklisted kernel modules
  ansible.builtin.lineinfile:
    dest: /etc/modprobe.d/blockblacklisted.conf
    line: "install {{ item }} /bin/true"
    mode: "0644"
    owner: root
    group: root
    state: present
    create: true
  loop: "{{ base_hardening_modprobe_blacklist.stdout_lines | sort }}"
  when: base_hardening_block_blacklisted | bool
...
