---
#******************************************************************************
# Role: base_hardening
# File: tasks/cron.yml
#******************************************************************************
- name: Set User/Group Owner and Permission on /etc/crontab
  ansible.builtin.file:
    path: /etc/crontab
    state: file
    owner: root
    group: root
    mode: og-rwx

- name: Set User/Group Owner and Permission on /etc/cron.hourly
  ansible.builtin.file:
    path: /etc/cron.hourly
    state: directory
    owner: root
    group: root
    mode: og-rwx

- name: Set User/Group Owner and Permission on /etc/cron.daily
  ansible.builtin.file:
    path: /etc/cron.daily
    state: directory
    owner: root
    group: root
    mode: og-rwx

- name: Set User/Group Owner and Permission on /etc/cron.weekly
  ansible.builtin.file:
    path: /etc/cron.weekly
    state: directory
    owner: root
    group: root
    mode: og-rwx

- name: Set User/Group Owner and Permission on /etc/cron.monthly
  ansible.builtin.file:
    path: /etc/cron.monthly
    state: directory
    owner: root
    group: root
    mode: og-rwx

- name: Set User/Group Owner and Permission on /etc/cron.d
  ansible.builtin.file:
    path: /etc/cron.d
    state: directory
    owner: root
    group: root
    mode: og-rwx

- name: Restrict cron to Authorized Users (Remove cron.deny)
  ansible.builtin.file:
    path: /etc/cron.deny
    state: absent

- name: Restrict at to Authorized Users (Remove at.deny)
  ansible.builtin.file:
    path: /etc/at.deny
    state: absent

# state: touch alone rewrites the timestamps on every run and always reports
# "changed"; preserving them makes the task idempotent.
- name: Restrict at to Authorized Users
  ansible.builtin.file:
    path: /etc/at.allow
    state: touch
    mode: og-rwx
    owner: root
    group: root
    access_time: preserve
    modification_time: preserve

- name: Restrict cron to Authorized Users
  ansible.builtin.file:
    path: /etc/cron.allow
    state: touch
    mode: og-rwx
    owner: root
    group: root
    access_time: preserve
    modification_time: preserve
