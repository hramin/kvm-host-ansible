# Production alert rules for KVM/libvirt hosts.
#
# severity: critical -> pages on-call immediately (customer VMs are down or about to go down)
# severity: warning  -> ticket/chat during business hours (redundancy or headroom is shrinking,
#                       customers are not affected yet)
# component: used by Alertmanager so a critical alert hides its own warning on the same host.

groups:
  - name: kvm-host-recording
    rules:
      # Average I/O latency per physical disk (seconds per completed request).
      # "> 0" on the denominator drops idle disks instead of dividing by zero.
      - record: host_device:disk_io_latency_seconds:avg5m
        expr: |
          (
              rate(node_disk_read_time_seconds_total{device=~"nvme.+|sd.+|vd.+|md.+"}[5m])
            + rate(node_disk_write_time_seconds_total{device=~"nvme.+|sd.+|vd.+|md.+"}[5m])
          )
          /
          (
              rate(node_disk_reads_completed_total{device=~"nvme.+|sd.+|vd.+|md.+"}[5m])
            + rate(node_disk_writes_completed_total{device=~"nvme.+|sd.+|vd.+|md.+"}[5m])
            > 0
          )

      # Share of packets dropped or errored on host NICs (guest taps, bridges and
      # container interfaces excluded: their drops are the guest's or Docker's business).
      - record: host_device:network_loss_ratio:rate5m
        expr: |
          (
              rate(node_network_receive_drop_total{device!~"lo|vnet.*|virbr.*|veth.*|docker.*|br-.*"}[5m])
            + rate(node_network_transmit_drop_total{device!~"lo|vnet.*|virbr.*|veth.*|docker.*|br-.*"}[5m])
            + rate(node_network_receive_errs_total{device!~"lo|vnet.*|virbr.*|veth.*|docker.*|br-.*"}[5m])
            + rate(node_network_transmit_errs_total{device!~"lo|vnet.*|virbr.*|veth.*|docker.*|br-.*"}[5m])
          )
          /
          (
              rate(node_network_receive_packets_total{device!~"lo|vnet.*|virbr.*|veth.*|docker.*|br-.*"}[5m])
            + rate(node_network_transmit_packets_total{device!~"lo|vnet.*|virbr.*|veth.*|docker.*|br-.*"}[5m])
            > 0
          )

      - record: host:memory_available_ratio
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes

      - record: host:cpu_usage_ratio:rate5m
        expr: 1 - avg by (host, instance, job) (rate(node_cpu_seconds_total{mode="idle"}[5m]))

  - name: kvm-host-availability
    rules:
      - alert: HostDown
        expr: up{job="node"} == 0
        for: 2m
        labels: {severity: critical, component: host}
        annotations:
          summary: "{{ $labels.host }} is unreachable"
          description: "node_exporter has not answered for 2 minutes. Every VM on this host may be down."

      - alert: LibvirtExporterDown
        expr: up{job="libvirt"} == 0
        for: 5m
        labels: {severity: warning, component: libvirt}
        annotations:
          summary: "libvirt exporter on {{ $labels.host }} is down"
          description: "VM state on this host is not monitored until the exporter is back (VM failure alerts cannot fire)."

  - name: kvm-host-vm
    rules:
      # libvirt state codes: 1 running, 3 paused, 5 shut off, 6 crashed.
      # QEMU pauses a guest by itself on host I/O errors or a full disk; a customer's
      # own shutdown (5) is not an alert.
      - alert: VMPausedOrCrashed
        expr: libvirt_domain_info_state == 3 or libvirt_domain_info_state == 6
        for: 1m
        labels: {severity: critical, component: vm}
        annotations:
          summary: "VM {{ $labels.domain }} on {{ $labels.host }}: {{ $labels.state_desc }}"
          description: "The guest is not running and the customer did not shut it down. Check 'virsh domstate --reason {{ $labels.domain }}' and host storage."

  - name: kvm-host-disk
    rules:
      - alert: DiskLatencyHigh
        expr: host_device:disk_io_latency_seconds:avg5m > 0.020
        for: 10m
        labels: {severity: warning, component: disk}
        annotations:
          summary: "Disk {{ $labels.device }} on {{ $labels.host }}: {{ $value | humanizeDuration }} per I/O"
          description: "Local NVMe normally answers in under 1 ms. Sustained 20 ms+ points to a failing or saturated device."

      - alert: DiskLatencyCritical
        expr: host_device:disk_io_latency_seconds:avg5m > 0.100
        for: 5m
        labels: {severity: critical, component: disk}
        annotations:
          summary: "Disk {{ $labels.device }} on {{ $labels.host }}: {{ $value | humanizeDuration }} per I/O"
          description: "Guests on this disk are stalling; QEMU will pause them on I/O errors. Rising latency often precedes a host dropping off entirely."

  - name: kvm-host-raid
    rules:
      - alert: RaidDegraded
        expr: (node_md_disks_required - ignoring(state) node_md_disks{state="active"}) > 0
        for: 5m
        labels: {severity: warning, component: raid}
        annotations:
          summary: "RAID {{ $labels.device }} on {{ $labels.host }} is degraded"
          description: "{{ $value }} member(s) missing. The array still serves data; replace the disk next business day. Escalate if a second member shows errors."

      - alert: RaidDiskFailed
        expr: node_md_disks{state="failed"} > 0
        for: 5m
        labels: {severity: warning, component: raid}
        annotations:
          summary: "RAID {{ $labels.device }} on {{ $labels.host }} has a failed member"
          description: "Schedule a disk swap during business hours."

      - alert: RaidArrayInactive
        expr: node_md_state{state="inactive"} == 1
        labels: {severity: critical, component: raid}
        annotations:
          summary: "RAID {{ $labels.device }} on {{ $labels.host }} is inactive"
          description: "The array is not serving data: every VM stored on it is down."

  - name: kvm-host-load
    rules:
      - alert: HostHighLoad
        expr: node_load15 / count without (cpu, mode) (node_cpu_seconds_total{mode="idle"}) > 2
        for: 30m
        labels: {severity: warning, component: cpu}
        annotations:
          summary: "{{ $labels.host }}: load is {{ $value | printf \"%.1f\" }}x the CPU count"
          description: "Guests get less CPU than they pay for. Rebalance VMs or stop overcommitting this host."

      - alert: HostCpuSaturated
        expr: host:cpu_usage_ratio:rate5m > 0.90
        for: 15m
        labels: {severity: warning, component: cpu}
        annotations:
          summary: "{{ $labels.host }}: CPU {{ $value | humanizePercentage }} busy"
          description: "Sustained CPU saturation on the hypervisor. Check for noisy neighbours (libvirt_domain_info_cpu_time_seconds_total)."

  - name: kvm-host-memory
    rules:
      - alert: HostMemoryPressure
        expr: host:memory_available_ratio < 0.10
        for: 10m
        labels: {severity: warning, component: memory}
        annotations:
          summary: "{{ $labels.host }}: only {{ $value | humanizePercentage }} memory available"
          description: "Little headroom left for guests. Stop placing VMs here and plan a rebalance."

      - alert: HostMemoryCritical
        expr: host:memory_available_ratio < 0.05
        for: 2m
        labels: {severity: critical, component: memory}
        annotations:
          summary: "{{ $labels.host }}: only {{ $value | humanizePercentage }} memory available"
          description: "The OOM killer is close. It picks the largest process, which on a hypervisor is a customer's QEMU."

      - alert: HostOomKill
        expr: increase(node_vmstat_oom_kill[5m]) > 0
        labels: {severity: critical, component: memory}
        annotations:
          summary: "OOM killer ran on {{ $labels.host }}"
          description: "A process was killed for memory in the last 5 minutes; check whether it was a guest (journalctl -k | grep -i oom)."

  - name: kvm-host-network
    rules:
      - alert: HostPacketLoss
        expr: host_device:network_loss_ratio:rate5m > 0.005
        for: 15m
        labels: {severity: warning, component: network}
        annotations:
          summary: "{{ $labels.host }} {{ $labels.device }}: {{ $value | humanizePercentage }} packets dropped/errored"
          description: "Check NIC counters (ethtool -S), cabling and the switch port."

      - alert: HostPacketLossCritical
        expr: host_device:network_loss_ratio:rate5m > 0.05
        for: 5m
        labels: {severity: critical, component: network}
        annotations:
          summary: "{{ $labels.host }} {{ $labels.device }}: {{ $value | humanizePercentage }} packets dropped/errored"
          description: "Guests on this host see broken connections."
