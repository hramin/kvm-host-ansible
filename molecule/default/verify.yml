---
# Checks real state on the converged containers (not task results).
- name: Verify
  hosts: kvm_hosts
  become: true
  gather_facts: true
  vars:
    # Inventory values (molecule.yml) win; otherwise the role defaults apply.
    admin: "{{ base_hardening_admin_users[0].name }}"
    blocklist: "{{ base_defaults.base_hardening_packages_blocklist + base_defaults.base_hardening_ntp_conflicting_packages }}"
    pool_name: "{{ kvm_host_storage_pool_name | default(kvm_defaults.kvm_host_storage_pool_name) }}"
    pool_path: "{{ kvm_host_storage_pool_path | default(kvm_defaults.kvm_host_storage_pool_path) }}"
    default_net_enabled: "{{ kvm_host_libvirt_default_network_enabled | default(kvm_defaults.kvm_host_libvirt_default_network_enabled) | bool }}"
    bridge_enabled: "{{ kvm_host_bridge_enabled | default(kvm_defaults.kvm_host_bridge_enabled) | bool }}"
    bridge_name: "{{ kvm_host_bridge_name | default(kvm_defaults.kvm_host_bridge_name) }}"
    bridge_network: "{{ kvm_host_bridge_libvirt_network | default(kvm_defaults.kvm_host_bridge_libvirt_network) }}"
  tasks:
    - name: Load the role defaults
      ansible.builtin.include_vars:
        file: "{{ item.file }}"
        name: "{{ item.name }}"
      loop:
        - { file: ../../roles/base_hardening/defaults/main.yml, name: base_defaults }
        - { file: ../../roles/kvm_host/defaults/main.yml, name: kvm_defaults }

    # ── Admin user, SSH keys, sudo ───────────────────────────────────────────
    - name: Read the admin user's groups
      ansible.builtin.command: id -nG {{ admin }}
      register: admin_groups
      changed_when: false

    - name: Read the admin user's sudo rights
      ansible.builtin.command: sudo -l -U {{ admin }}
      register: admin_sudo
      changed_when: false

    - name: Read the admin user's authorized_keys
      ansible.builtin.slurp:
        src: /home/{{ admin }}/.ssh/authorized_keys
      register: admin_keys

    - name: Check the whole sudoers configuration parses
      ansible.builtin.command: visudo -c
      changed_when: false

    - name: Assert admin user, groups, key and passwordless sudo
      ansible.builtin.assert:
        that:
          - "'admins' in admin_groups.stdout.split()"
          - "'libvirt' in admin_groups.stdout.split()"
          - "'(ALL : ALL) NOPASSWD: ALL' in admin_sudo.stdout"
          - "base_hardening_admin_users[0].ssh_keys[0] in (admin_keys.content | b64decode)"

    # ── SSH ──────────────────────────────────────────────────────────────────
    - name: Validate sshd_config (sshd -t)
      ansible.builtin.command: sshd -t
      changed_when: false

    - name: Read the effective sshd configuration (sshd -T)
      ansible.builtin.command: sshd -T -C user={{ admin }},host=client,addr=172.17.0.1
      register: sshd_effective
      changed_when: false

    - name: Assert root login is off and only the admin group may log in
      ansible.builtin.assert:
        that:
          - "'permitrootlogin no' in sshd_effective.stdout_lines"
          - "'allowgroups admins' in sshd_effective.stdout_lines"
          - "'passwordauthentication no' in sshd_effective.stdout_lines"
          - "'kbdinteractiveauthentication no' in sshd_effective.stdout_lines"

    # ── Services ─────────────────────────────────────────────────────────────
    - name: Assert units are active
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      register: service_active
      failed_when: service_active.status.ActiveState != 'active'
      loop:
        - ssh
        - chrony
        - fail2ban
        - libvirtd
        - libvirtd.socket
        - libvirtd-ro.socket
        - virtlogd.socket
        - libvirt-guests
        - systemd-journald
        - tmp.mount

    - name: Assert units are enabled
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      register: service_enabled
      failed_when: service_enabled.status.UnitFileState != 'enabled'
      loop:
        - ssh
        - chrony
        - fail2ban
        - libvirtd
        - libvirtd.socket
        - libvirt-guests
        - nftables
        - auditd
        - tmp.mount

    - name: Check that fail2ban runs the sshd jail
      ansible.builtin.command: fail2ban-client status sshd
      changed_when: false

    # ── Packages ─────────────────────────────────────────────────────────────
    - name: Gather package facts
      ansible.builtin.package_facts:

    - name: Assert blocklisted and conflicting packages are absent
      ansible.builtin.assert:
        that:
          - blocklist | select('in', ansible_facts.packages) | list | length == 0
          - "'qemu-system-x86' in ansible_facts.packages"
          - "'libvirt-daemon-system' in ansible_facts.packages"
          - "'ovmf' in ansible_facts.packages"
        fail_msg: "Present but blocklisted: {{ blocklist | select('in', ansible_facts.packages) | list }}"

    # ── chrony ───────────────────────────────────────────────────────────────
    - name: Ask chronyd for its sources
      ansible.builtin.command: chronyc -n sources
      register: chrony_sources
      changed_when: false

    # ── journald ─────────────────────────────────────────────────────────────
    - name: Find the persistent system journal
      ansible.builtin.find:
        paths: /var/log/journal
        patterns: system.journal
        recurse: true
      register: journal_files

    - name: Read the effective journald configuration
      ansible.builtin.command: systemd-analyze cat-config systemd/journald.conf
      register: journald_config
      changed_when: false

    - name: Assert the journal is persistent and size-limited
      ansible.builtin.assert:
        that:
          - journal_files.matched > 0
          - "'Storage=persistent' in journald_config.stdout"
          - "'SystemMaxUse=1G' in journald_config.stdout"

    # ── libvirt ──────────────────────────────────────────────────────────────
    - name: List guests as root
      ansible.builtin.command: virsh -c qemu:///system list --all
      changed_when: false

    - name: List guests as the admin user (libvirt group, no sudo)
      ansible.builtin.command: runuser -u {{ admin }} -- virsh -c qemu:///system list --all
      changed_when: false

    - name: Read the libvirt socket permissions
      ansible.builtin.stat:
        path: /run/libvirt/libvirt-sock
      register: libvirt_sock

    - name: Read /etc/default/libvirtd
      ansible.builtin.slurp:
        src: /etc/default/libvirtd
      register: libvirtd_default

    - name: Assert libvirt sockets are limited to the libvirt group and libvirtd has no idle timeout
      ansible.builtin.assert:
        that:
          - libvirt_sock.stat.gr_name == 'libvirt'
          - libvirt_sock.stat.mode == '0770'
          - "'LIBVIRTD_ARGS=\"\"' in (libvirtd_default.content | b64decode)"

    - name: Read storage pool info
      ansible.builtin.command: virsh -c qemu:///system pool-info {{ pool_name }}
      register: pool_info
      changed_when: false

    - name: Read storage pool XML
      ansible.builtin.command: virsh -c qemu:///system pool-dumpxml {{ pool_name }}
      register: pool_xml
      changed_when: false

    - name: Assert the storage pool is defined, running, autostarted, on the configured path
      ansible.builtin.assert:
        that:
          - pool_info.stdout is search('State:\s+running')
          - pool_info.stdout is search('Autostart:\s+yes')
          - "'<path>' ~ pool_path ~ '</path>' in pool_xml.stdout"
          - "'type=\\'dir\\'' in pool_xml.stdout or 'type=\"dir\"' in pool_xml.stdout"

    - name: Read the default network state
      ansible.builtin.command: virsh -c qemu:///system net-info default
      register: default_net
      changed_when: false

    - name: Assert the default NAT network matches the setting
      ansible.builtin.assert:
        that:
          - default_net.stdout is search('Active:\s+' ~ (default_net_enabled | ternary('yes', 'no')))
          - default_net.stdout is search('Autostart:\s+' ~ (default_net_enabled | ternary('yes', 'no')))

    - name: Read the bridge and its libvirt network
      ansible.builtin.command: "{{ item }}"
      loop:
        - ip -d link show {{ bridge_name }}
        - virsh -c qemu:///system net-info {{ bridge_network }}
      register: bridge_state
      changed_when: false
      when: bridge_enabled

    - name: Assert the bridge exists and its libvirt network is active
      ansible.builtin.assert:
        that:
          - bridge_state.results[0].stdout is search('bridge')
          - bridge_state.results[1].stdout is search('Active:\s+yes')
          - bridge_state.results[1].stdout is search('Autostart:\s+yes')
      when: bridge_enabled

    - name: Read libvirt-guests configuration
      ansible.builtin.slurp:
        src: /etc/default/libvirt-guests
      register: guests_config

    - name: Assert libvirt-guests shutdown/boot behaviour
      ansible.builtin.assert:
        that:
          - "'ON_SHUTDOWN=shutdown' in (guests_config.content | b64decode)"
          - "'ON_BOOT=start' in (guests_config.content | b64decode)"
          - "'SHUTDOWN_TIMEOUT=300' in (guests_config.content | b64decode)"

    # ── Firewall (rendered + validated; the live load is skipped in containers) ─
    - name: Validate the rendered ruleset with nft -c
      ansible.builtin.command: nft -c -f /etc/nftables.conf
      changed_when: false

    - name: Read the ruleset and the nftables.service drop-in
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /etc/nftables.conf
        - /etc/systemd/system/nftables.service.d/10-host-firewall.conf
      register: nft_files

    - name: Assert the ruleset only manages its own table
      ansible.builtin.assert:
        that:
          # no "flush" statement outside comments
          - (nft_files.results[0].content | b64decode).splitlines() | reject('match', '\s*#') | select('search', 'flush') | list | length == 0
          - "'delete table inet host_firewall' in (nft_files.results[0].content | b64decode)"
          - "'policy drop' in (nft_files.results[0].content | b64decode)"
          - "'ip saddr { 172.16.0.0/12 } tcp dport 22 accept' in (nft_files.results[0].content | b64decode)"
          - "'hook forward' not in (nft_files.results[0].content | b64decode)"
          - "'ExecStop=-/usr/sbin/nft delete table inet host_firewall' in (nft_files.results[1].content | b64decode)"

    # ── Kernel parameters and modules ────────────────────────────────────────
    - name: Read namespaced sysctls that were applied live
      ansible.builtin.command: sysctl -n {{ item }}
      loop:
        - net.ipv4.conf.all.accept_redirects
        - net.ipv4.tcp_syncookies
        - net.bridge.bridge-nf-call-iptables
      register: live_sysctls
      changed_when: false

    - name: Read the sysctl.d files
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /etc/sysctl.d/99-hardening.conf
        - /etc/sysctl.d/60-kvm-host.conf
        - /etc/modules-load.d/kvm-host.conf
      register: kernel_files

    - name: Assert sysctl files, live values and module list
      ansible.builtin.assert:
        that:
          - live_sysctls.results | map(attribute='stdout') | list == ['0', '1', '0']
          - "'kernel.sysrq=176' in (kernel_files.results[0].content | b64decode)"
          - "'net.ipv4.ip_forward' not in (kernel_files.results[0].content | b64decode)"
          - "'fs.aio-max-nr = 1048576' in (kernel_files.results[1].content | b64decode)"
          - "'net.bridge.bridge-nf-call-iptables = 0' in (kernel_files.results[1].content | b64decode)"
          - (kernel_files.results[2].content | b64decode).split() | intersect(['kvm', 'vhost_net', 'tun', 'bridge']) | length == 4

    # ── Mounts ───────────────────────────────────────────────────────────────
    - name: Read mount options of /tmp and /proc
      ansible.builtin.command: findmnt -no OPTIONS {{ item }}
      loop: [/tmp, /proc]
      register: mount_options
      changed_when: false

    - name: Assert /tmp is noexec and /proc hides other users' processes
      ansible.builtin.assert:
        that:
          - "'noexec' in mount_options.results[0].stdout"
          - mount_options.results[1].stdout is search('hidepid=(invisible|2)')

    # ── Logging / audit ──────────────────────────────────────────────────────
    - name: Dry-run logrotate (duplicate entries would fail)
      ansible.builtin.command: logrotate -d /etc/logrotate.conf
      changed_when: false

    - name: Read audit configuration
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /etc/audit/auditd.conf
        - /etc/audit/rules.d/hardening.rules
      register: audit_files

    - name: Assert auditd settings and rules are in place
      ansible.builtin.assert:
        that:
          - "'space_left_action = syslog' in (audit_files.results[0].content | b64decode)"
          - "'-k libvirt' in (audit_files.results[1].content | b64decode)"
          - "'-k docker' not in (audit_files.results[1].content | b64decode)"
          - (audit_files.results[1].content | b64decode).rstrip().endswith('-e 2')
