---
# Docker scenario: used because the machine running the tests has no /dev/kvm
# (see README "Testing"). Two systemd containers, Debian 12 and Debian 13,
# run the full site.yml with kvm_host_test_mode: container.
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml

driver:
  name: docker

platforms:
  - name: kvm-host-debian12
    image: debian:12
    dockerfile: Dockerfile.j2
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    command: /lib/systemd/systemd
    groups: [kvm_hosts]
  - name: kvm-host-debian13
    image: debian:13
    dockerfile: Dockerfile.j2
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    command: /lib/systemd/systemd
    groups: [kvm_hosts]

provisioner:
  name: ansible
  env:
    ANSIBLE_NOCOLOR: "1"
    ANSIBLE_FORCE_COLOR: "0"
    ANSIBLE_ROLES_PATH: ../../roles
  config_options:
    defaults:
      callback_result_format: yaml
      force_handlers: true
  inventory:
    group_vars:
      kvm_hosts:
        # The one test switch: skip only what a container cannot do.
        kvm_host_test_mode: container
        # The machine running these containers has no vmx/svm; this exercises
        # the software-emulation path (warning, no vendor module).
        kvm_host_allow_software_emulation: true
        # Docker bridge networks; not used for access (connection is docker exec).
        base_hardening_management_cidrs: [172.16.0.0/12]
        base_hardening_admin_users:
          - name: kvmadmin
            comment: Molecule test admin
            ssh_keys:
              - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID67QRf6Ngvhu3+CUV+aPMln2/UIl/kNGWAqb6DARbZy molecule-test-only"
        # Not a production value: proves extra ports render and validate.
        base_hardening_firewall_allowed_ports:
          - { port: "5900-5999", proto: tcp }
    host_vars:
      kvm-host-debian12:
        base_hardening_debian_version: "12"
        # Exercise the (default-off) bridge path on one platform: a bridge
        # without uplink, created by systemd-networkd, plus its libvirt network.
        kvm_host_bridge_enabled: true
      kvm-host-debian13:
        base_hardening_debian_version: "13"
        # Exercise the enabled path of the default NAT network on one platform.
        kvm_host_libvirt_default_network_enabled: true
  playbooks:
    converge: converge.yml
    verify: verify.yml

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - create
    - converge
    - idempotence
    - verify
    - destroy
