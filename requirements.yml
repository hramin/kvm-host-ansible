---
# ansible-galaxy collection install -r requirements.yml
collections:
  # Used by the roles.
  - name: ansible.posix          # sysctl, mount, authorized_key
    version: ">=1.5.4"
  - name: community.general      # modprobe
    version: ">=8.0.0"
  - name: community.libvirt      # virt_pool, virt_net
    version: ">=1.3.0"
  # Used only by the molecule Docker scenario.
  - name: community.docker
    version: ">=3.10.0"
