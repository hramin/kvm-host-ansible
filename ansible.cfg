[defaults]
inventory = inventories/lab/hosts.yml
roles_path = roles
# ansible-galaxy installs requirements.yml into the first entry (./collections, git-ignored).
collections_path = ./collections:~/.ansible/collections:/usr/share/ansible/collections
interpreter_python = auto_silent
# Run notified handlers even when a later task fails, so an already-written
# sshd_config/nftables.conf is never left unapplied (the template would not
# report "changed" again on the next run and the handler would be lost).
force_handlers = True
callback_result_format = yaml
retry_files_enabled = False
host_key_checking = True
forks = 10

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30
